# Release: publishes a new version.
#
# Runs when a tag like v0.1.0 is pushed. Each job does one thing and only the
# last two get any permissions beyond reading the repository:
#
#   check-version -> ci -> build -> publish-pypi -> github-release
#
#   check-version   the tag must equal the version in pyproject.toml
#   ci              the full CI (ci.yml) must pass on the tagged commit
#   build           builds the sdist and wheel, smoke-tests the wheel, and
#                   keeps both as the "dist" artifact (no permissions needed)
#   publish-pypi    uploads exactly that artifact to PyPI with trusted
#                   publishing (no token); it never builds anything
#   github-release  creates the GitHub release with the same files attached; the body
#                   is composed by .github/scripts/release-body.sh (the version's notes
#                   plus the fixed Install section)
#
# To release: bump `version` in pyproject.toml, commit, then
#   git tag v<version> && git push origin v<version>
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Compare the tag with the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

  ci:
    name: CI on the tagged commit
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and smoke-test the package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Build sdist and wheel
        run: uv build
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv --python 3.13 .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          .smoke-venv/bin/omarchy-dms --help >/dev/null
      - name: Keep the files for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI trusts this workflow, no API token
    steps:
      - name: Get the files built above
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    name: Create the GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Get the files built above
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Compose the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-body.sh "$TAG" > release-body.md
      - name: Create the release with the files attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-body.md
