name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Compare tag with pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

  ci:
    name: CI gate
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: ci
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Build package
        run: uv build
      - name: Check the wheel installs and runs
        run: |
          uv venv --python 3.13 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/omarchy-dms --help >/dev/null
      - uses: pypa/gh-action-pypi-publish@v1.14.3
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
