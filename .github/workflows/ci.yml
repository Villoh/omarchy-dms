# CI: checks that the code is healthy.
#
# Runs on every pull request and every push to main. release.yml also calls it
# as a gate, so a tag cannot publish a commit that does not pass.
#
#   lint  ruff (lint and format) and that uv.lock is up to date
#   test  unit tests on every supported Python version
#   nix   the flake still builds (the build runs the tests again)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --locked
      - name: Run the tests
        run: uv run python -m unittest discover -s tests

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.9.1
      - name: Flake checks
        run: nix flake check
      - name: Build the package
        run: nix build .#default --print-build-logs
